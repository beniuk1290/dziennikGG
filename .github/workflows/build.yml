name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdk-manager "ndk;25.2.9519653"

    - name: Setup CMake
      run: sdk-manager "cmake;3.22.1"

    - name: Setup Google Services
      run: echo '${{{ secrets.GOOGLE_SERVICES_JSON }}}' > app/google-services.json

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleUnofficialDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dziennikGG-apk
        path: app/build/outputs/apk/unofficial/debug/*.apk
