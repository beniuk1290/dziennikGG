name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.3)'
        required: true
        default: 'v0.1.3'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dziennikGG-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 1

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Build iOS Archive
        run: |
          cd iosApp
          xcodebuild -scheme iosApp -configuration Release \
            -archivePath iosApp.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA from Archive
        run: |
          cd iosApp
          mkdir -p Payload
          cp -r iosApp.xcarchive/Products/Applications/dziennikGG.app Payload/
          zip -r iosApp-export/dziennikGG.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dziennikGG-ios
          path: iosApp/iosApp-export/dziennikGG.ipa
          retention-days: 1
          if-no-files-found: warn
